# Everything runs inside the participant's own Codespace VM - nothing is shared.
services:
  workspace:
    # Pinned to Debian bookworm: the Docker add-on doesn't install cleanly on newer bases.
    image: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity

  postgres:
    image: ehrbase/ehrbase-v2-postgres:16.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EHRBASE_USER_ADMIN: ehrbase
      EHRBASE_PASSWORD_ADMIN: ehrbase
      EHRBASE_USER: ehrbase_restricted
      EHRBASE_PASSWORD: ehrbase_restricted
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  ehrbase:
    image: ehrbase/ehrbase:2.0.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ehrbase
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      DB_USER: ehrbase_restricted
      DB_PASS: ehrbase_restricted
      # The forwarded port is private to the participant's GitHub login,
      # and the form reaches EHRbase through the Vite proxy, so no app auth needed.
      SECURITY_AUTHTYPE: NONE
      JAVA_TOOL_OPTIONS: -Xmx1g

volumes:
  db_data: {}
